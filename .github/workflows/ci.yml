name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**'
      - '!**/*.md'
      - '!**/.*'
      - '!**/.*/**'
      - '.github/**'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!**/.*'
      - '!**/.*/**'
      - '.github/**'

permissions:
  contents: write

env:
  # Path to the Sonarr publish output consumed by build.sh / test.sh -s
  SONARR_PUBLISH_DIR: /tmp/Sonarr/_output/net6.0/linux-x64/publish

jobs:
  build:
    name: Build & full tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Build Sonarr backend (Console project only, linux-x64)
        uses: ./.github/actions/build-sonarr

      - name: Build patches against Sonarr
        run: ./build.sh -s "$SONARR_PUBLISH_DIR"

      - name: Full test suite (integration tests included)
        run: dotnet test SonarrPatcher.sln -c Release --no-build --nologo -p:SonarrDir="$SONARR_PUBLISH_DIR"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Full tests & release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Build Sonarr backend (Console project only, linux-x64)
        uses: ./.github/actions/build-sonarr

      - name: Full test suite (including SkyHook integration tests)
        run: ./test.sh -s "$SONARR_PUBLISH_DIR"

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            SonarrPatcher ${{ github.ref_name }}

            - `dist/SonarrPatcher.Loader.dll` — startup-hook loader
            - `dist/SonarrPatcher.Patches.SkyHook.dll` — SkyHook redirect patch (see [SkyHook/README.md](SonarrPatcher.Patches/SkyHook/README.md))
            - `dist/SonarrPatcher.Patches.NameTruncate.dll` — character-based `{name:N}` truncation patch (see [NameTruncate/README.md](SonarrPatcher.Patches/NameTruncate/README.md))
            - `dist/SonarrPatcher.Patches.XemAliases.dll` — allNames redirect + non-English alias patch (see [XemAliases/README.md](SonarrPatcher.Patches/XemAliases/README.md))
          files: dist/*
